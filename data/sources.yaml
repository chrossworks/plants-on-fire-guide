  kind: user
  mode: standard
  description: 2026-09-14ユーザーの実機確認。オーキッド占星術師の最低レベル（Lv.7）は攻撃力10、準備完了の攻撃力強化は星1で+4、星2で+8、星3で+16。凍結中のミニオンがいない場合は自身に同値を付与。
