observations:
  - name: アッポリス
    source: rc-appolis-detail
    deck: cloud
    currentLevel: {status: observed, value: 6, sources: [rc-appolis-detail]}
    guaranteedLevel: {status: observed, value: 7, sources: [rc-appolis-detail]}
    selectedStar: 1
    bondPoints: {status: observed, value: 1, sources: [rc-appolis-detail]}
    attack: {status: observed, value: 7, sources: [rc-appolis-detail]}
    interval: {status: observed, value: 2.5, sources: [rc-appolis-detail]}
    target: {status: observed, value: 最前列, sources: [rc-appolis-detail]}
    ability: {status: observed, value: '敵6体を同時に攻撃し、50%のダメージを与える', sources: [rc-appolis-detail]}
    conditions: 現在Lv.6と最低保証Lv.7の両表示。ON表示。星1選択、星4タブあり。表示攻撃力を通常モードのLv.6性能や初期値とはみなさない。
  - name: オーキッド占星術師
    source: rc-orchid-detail
    deck: star
    currentLevel: {status: observed, value: 8, sources: [rc-orchid-detail]}
    guaranteedLevel: {status: unknown, reason: この画像では最低保証Lvの数値は表示されていない}
    selectedStar: 1
    bondPoints: {status: observed, value: 1, sources: [rc-orchid-detail]}
    attack: {status: observed, value: 10, sources: [rc-orchid-detail]}
    interval: {status: observed, value: 2, sources: [rc-orchid-detail]}
    target: {status: observed, value: 最前列, sources: [rc-orchid-detail]}
    ability: {status: observed, value: '準備完了：ショップ内のランダムな凍結中のミニオン1体の攻撃力+5。凍結中のミニオンがいない場合、自身の攻撃力+5', sources: [rc-orchid-detail]}
    conditions: Lv.8、ON表示。星1選択、星4タブあり。絆アイコンはカードプールの星デッキ表示と照合。バリアント非表示を不存在の根拠にしない。

rules:
  sharedPerformance:
    status: manual
    value: 攻撃力・星1〜3の能力は同じレベルで通常とランブルチェスに差分がない。ランブルチェスでは星4まで合成できる。
    sources:
      - rc-rules-user-20260925
  minimumGuaranteedLevel:
    status: manual
    value: 7
    sources:
      - rc-rules-user-20260925
  bondPointsByStar:
    status: manual
    value:
      "1": 1
      "2": 2
      "3": 4
      "4": 8
    sources:
      - rc-rules-user-20260925
