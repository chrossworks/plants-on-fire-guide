schemaVersion: 1
mode: rumble-chess
updated: '2026-09-14'
note: 画像から確認した絆所属を保存。サイトでは未使用。撮影時点の6デッキ各10体を収録し、共有デッキは対象外。通常モードの性能・初期値・バリアント判定へ転用しない。
decks:
  - id: cloud
    name: {status: observed, value: 雲デッキ, sources: [rc-overview]}
    members:
      status: observed
      value: [アンナイツバキ, ポテトセラー, アッポリス, グレープバーテンダー, サムライタケ, ザクロブラスター, スペルベリー, チリコック, ゴールドイーター, ドングリマッドマン]
      sources: [rc-cloud]
  - id: moon
    name: {status: observed, value: 月デッキ, sources: [rc-overview]}
    members:
      status: observed
      value: [マッシュボム, カラカボチャ, グリーンキーパー, ゴーストオーキッド, カボチャナイト, ダンデライオン, テレ・リーフィー, ヴァルキリス, ブラックローズナイト, ウィキッドミラー]
      sources: [rc-moon]
  - id: sun
    name: {status: observed, value: 太陽デッキ, sources: [rc-overview]}
    members:
      status: observed
      value: [タネワーカー, ココバンク, サボテンガーディアン, モヒートン, メロンアカウンタント, ドラフルガード, ヒマワリ店長, ヒマワリバンカー, レディ・チューリップ, コーヒービーンチーフ]
