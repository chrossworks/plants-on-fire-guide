schemaVersion: 1
mode: rumble-chess
updated: '2026-09-22'
note: 画像から確認した絆所属と6デッキ各10段階の絆効果を保存。サイトでは未使用。撮影時点の6デッキ各10体を収録し、共有デッキは対象外。通常モードの性能・初期値・バリアント判定へ転用しない。
