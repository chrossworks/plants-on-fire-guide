  - id: violet-mage
    target:
      kind: minion
      id: violet-mage
      minionId: violet-mage
      name: バイオレット魔法使い
    type: buff
    announcement:
      status: observed
      value: |-
        基本マジックミサイルの発射数を増加させ、星ランクに応じて発射数をさらに増やせるように調整しました。
        魔法発動間隔は4秒のまま。メインスキルLv.9：マジックミサイルを1/3/5発発射し、ダメージはそれぞれ50%/60%/70%、55%/66%/77%、60%/72%/84%。
        Lv.10～12：マジックミサイルを2/5/10発発射し、ダメージはそれぞれ60%/72%/84%、67%/80%/93%、75%/90%/105%。
        フィールド上に存在する自身と同じ星ランクのミニオン1体につき、追加でマジックミサイルを1発発射する。
      sources:
        - update-20260929-005258
